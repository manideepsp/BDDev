# Fly.io config for the Nexus BD backend.
# Run `fly launch --no-deploy` once to claim the app name, then `fly deploy`.
app = "nexus-bd-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DB_PATH = "/data/nexus.db"
  FASTEMBED_CACHE_PATH = "/data/.fastembed_cache"

# Persistent volume so SQLite + the embedding model cache survive restarts.
# Create it once: `fly volumes create nexus_data --size 1 --region iad`
[mounts]
  source = "nexus_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.checks]
    [http_service.checks.health]
      method = "GET"
      path = "/health"
      interval = "30s"
      timeout = "5s"
      grace_period = "20s"

[[vm]]
  # fastembed + onnxruntime need headroom; 256MB free tier is too small.
  size = "shared-cpu-1x"
  memory = "1gb"
