<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KS Business — CRAIL Hackathon 2026</title>

<!-- External libs (loaded from CDN; deck degrades gracefully if offline) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e1a;
    --bg2: #141b2e;
    --bg3: #1f2940;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #6366f1;
    --accent2: #818cf8;
    --cyan: #22d3ee;
    --green: #10b981;
    --amber: #f59e0b;
    --red: #ef4444;
    --code-bg: #0a0f1c;
    --border: #283349;
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    --mono: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
  }

  html, body { height: 100%; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); overflow: hidden; }

  /* Three.js animated background */
  #bg-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

  /* ════════════ APP / PRESENTATION ════════════ */
  #app { position: relative; z-index: 2; width: 100vw; height: 100vh; display: flex; flex-direction: column; }
  #app.edit-open { display: none; }

  #progress-bar { height: 3px; background: rgba(255,255,255,.06); flex-shrink: 0; }
  #progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--cyan)); transition: width .4s cubic-bezier(.2,.8,.2,1); box-shadow: 0 0 12px var(--accent); }

  #toolbar {
    display: flex; align-items: center; gap: 10px; padding: 9px 18px;
    background: rgba(20,27,46,.72); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border); flex-shrink: 0; transition: opacity .3s, transform .3s;
  }
  #toolbar .logo { font-weight: 800; font-size: 15px; letter-spacing: .06em;
    background: linear-gradient(90deg, var(--accent2), var(--cyan)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  #toolbar .spacer { flex: 1; }
  #toolbar .counter { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 54px; text-align: right; }
  #part-label { font-size: 11px; color: var(--accent2); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; opacity: .8; }

  .tb-btn {
    background: var(--bg3); color: var(--text); border: 1px solid transparent; border-radius: 8px;
    padding: 6px 13px; font-size: 12px; cursor: pointer; font-family: var(--font);
    transition: all .15s; display: inline-flex; align-items: center; gap: 5px;
  }
  .tb-btn:hover { background: #2c3a5c; border-color: var(--accent); transform: translateY(-1px); }
  .tb-btn.active { background: var(--accent); border-color: var(--accent); }
  .tb-btn.primary { background: linear-gradient(90deg, var(--accent), #4f46e5); font-weight: 600; }
  .tb-btn.primary:hover { box-shadow: 0 4px 16px rgba(99,102,241,.5); }

  /* Dropdown */
  .dropdown { position: relative; }
  .dropdown-menu {
    position: absolute; right: 0; top: calc(100% + 6px); background: var(--bg2);
    border: 1px solid var(--border); border-radius: 10px; padding: 6px; min-width: 230px;
    box-shadow: 0 16px 40px rgba(0,0,0,.5); display: none; z-index: 200;
  }
  .dropdown-menu.open { display: block; animation: popIn .15s ease; }
  @keyframes popIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  .dropdown-menu button {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: none; border: none; color: var(--text); padding: 9px 11px; border-radius: 7px;
    font-size: 13px; cursor: pointer; font-family: var(--font);
  }
  .dropdown-menu button:hover { background: var(--bg3); }
  .dropdown-menu button .sub { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; }
  .dropdown-menu .dd-sep { height: 1px; background: var(--border); margin: 5px 4px; }

  #slides-wrapper { flex: 1; position: relative; overflow: hidden; }

  .slide {
    position: absolute; inset: 0; padding: 52px 76px;
    display: flex; flex-direction: column; justify-content: center;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .5s ease, transform .5s cubic-bezier(.2,.8,.2,1);
    transform: translateX(40px) scale(.985);
  }
  .slide.active { opacity: 1; visibility: visible; pointer-events: all; transform: translateX(0) scale(1); }
  .slide.leaving { opacity: 0; transform: translateX(-40px) scale(.985); }
  .slide.title-slide, .slide.part-divider { align-items: center; text-align: center; }

  .slide-inner {
    max-width: 1120px; width: 100%; margin: 0 auto;
    max-height: calc(100vh - 150px); overflow-y: auto; padding-right: 6px;
  }
  .slide-inner::-webkit-scrollbar { width: 5px; }
  .slide-inner::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; }

  .slide-tag {
    display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; color: var(--cyan); margin-bottom: 18px;
    padding: 4px 12px; border: 1px solid rgba(34,211,238,.3); border-radius: 20px;
    background: rgba(34,211,238,.07);
  }

  /* Staggered entrance of slide children */
  .slide.active .slide-inner > * { animation: riseIn .55s cubic-bezier(.2,.85,.25,1) both; }
  .slide.active .slide-inner > *:nth-child(1){animation-delay:.05s}
  .slide.active .slide-inner > *:nth-child(2){animation-delay:.12s}
  .slide.active .slide-inner > *:nth-child(3){animation-delay:.19s}
  .slide.active .slide-inner > *:nth-child(4){animation-delay:.26s}
  .slide.active .slide-inner > *:nth-child(5){animation-delay:.33s}
  .slide.active .slide-inner > *:nth-child(6){animation-delay:.40s}
  .slide.active .slide-inner > *:nth-child(7){animation-delay:.47s}
  .slide.active .slide-inner > *:nth-child(n+8){animation-delay:.54s}
  @keyframes riseIn { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }

  /* Rendered markdown */
  .md h1 { font-size: clamp(30px, 4.4vw, 58px); font-weight: 800; line-height: 1.08; color: #fff; margin-bottom: 18px; letter-spacing: -.02em; }
  .md h2 { font-size: clamp(22px, 3vw, 38px); font-weight: 700; line-height: 1.18; color: #e8edf7; margin-bottom: 14px; letter-spacing: -.01em; }
  .md h3 { font-size: clamp(16px, 2vw, 25px); font-weight: 600; margin-bottom: 12px;
    background: linear-gradient(90deg, var(--accent2), var(--cyan)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .md h4 { font-size: clamp(14px, 1.6vw, 19px); font-weight: 600; color: var(--accent2); margin-bottom: 8px; }
  .md p { font-size: clamp(13px, 1.55vw, 18px); line-height: 1.7; color: #cbd5e1; margin-bottom: 11px; }
  .md strong { color: #fff; font-weight: 700; }
  .md em { color: var(--accent2); font-style: italic; }
  .md code { font-family: var(--mono); background: var(--code-bg); color: var(--cyan); padding: 2px 6px; border-radius: 4px; font-size: .87em; border: 1px solid rgba(34,211,238,.15); }
  .md pre { background: var(--code-bg); border: 1px solid #1c3350; border-radius: 10px; padding: 16px 20px; overflow-x: auto; margin: 13px 0; box-shadow: inset 0 1px 0 rgba(255,255,255,.03); }
  .md pre code { background: none; padding: 0; border: none; color: #a5f3fc; font-size: clamp(10px, 1.1vw, 13px); line-height: 1.6; }
  .md pre::-webkit-scrollbar { height: 5px; }
  .md pre::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; }
  .md blockquote { border-left: 3px solid var(--accent); padding: 11px 18px; background: rgba(99,102,241,.08); border-radius: 0 8px 8px 0; margin: 13px 0; }
  .md blockquote p { color: #aab6cc; font-size: clamp(12px, 1.4vw, 16px); margin: 0; font-style: italic; }
  .md ul, .md ol { padding-left: 26px; margin: 9px 0; }
  .md li { font-size: clamp(12px, 1.5vw, 17px); line-height: 1.7; color: #cbd5e1; margin-bottom: 5px; }
  .md li::marker { color: var(--accent2); }
  .md li strong { color: #fff; }
  .md table { border-collapse: collapse; width: 100%; margin: 13px 0; font-size: clamp(11px, 1.3vw, 15px); border-radius: 10px; overflow: hidden; }
  .md th { background: rgba(99,102,241,.22); color: var(--accent2); font-weight: 600; padding: 9px 15px; text-align: left; border: 1px solid var(--border); }
  .md td { padding: 8px 15px; border: 1px solid var(--border); color: #cbd5e1; }
  .md tr:nth-child(even) td { background: rgba(255,255,255,.025); }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 15px 0; }
  .md del { text-decoration: line-through; color: var(--red); opacity: .85; }

  /* Title / part divider flourish */
  .slide.title-slide .md h1 { font-size: clamp(38px, 6vw, 76px); }
  .slide.part-divider .md h1 { font-size: clamp(28px, 5.5vw, 70px);
    background: linear-gradient(90deg, var(--accent2), var(--cyan)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .slide.part-divider .md h2 { color: var(--muted); font-weight: 500; }

  /* Nav arrows */
  .nav-arrow {
    position: fixed; top: 50%; transform: translateY(-50%);
    background: rgba(20,27,46,.6); border: 1px solid var(--border);
    color: var(--muted); width: 46px; height: 84px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 22px; transition: all .18s; z-index: 60;
    backdrop-filter: blur(6px); user-select: none;
  }
  .nav-arrow:hover { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 20px rgba(99,102,241,.5); }
  #nav-prev { left: 14px; }
  #nav-next { right: 14px; }

  /* Dots */
  #dots { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 7px; z-index: 60; flex-wrap: wrap; max-width: 70vw; justify-content: center; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bg3); cursor: pointer; transition: all .2s; }
  .dot.active { background: var(--accent); transform: scale(1.45); box-shadow: 0 0 10px var(--accent); }
  .dot:hover { background: var(--accent2); }

  /* Speaker notes panel */
  #notes-panel {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 120;
    background: rgba(10,14,26,.96); border-top: 2px solid var(--accent);
    padding: 16px 76px; max-height: 220px; overflow-y: auto;
    transform: translateY(100%); transition: transform .3s ease; backdrop-filter: blur(10px);
  }
  #notes-panel.open { transform: translateY(0); }
  #notes-panel h4 { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--accent2); margin-bottom: 8px; }
  #notes-panel p { font-size: 15px; color: #aab6cc; line-height: 1.65; }

  #hint { position: fixed; bottom: 38px; right: 16px; font-size: 10.5px; color: #3a455e; z-index: 60; text-align: right; line-height: 1.9; pointer-events: none; }

  /* ════════════ PRESENT (FULLSCREEN) MODE ════════════ */
  body.presenting #toolbar { opacity: 0; transform: translateY(-100%); pointer-events: none; height: 0; padding: 0; overflow: hidden; }
  body.presenting #hint { display: none; }
  body.presenting.pointer-on { cursor: none; }
  body.presenting.pointer-on .nav-arrow,
  body.presenting.pointer-on .dot { cursor: none; }

  /* Pointer FX layers */
  #spotlight { position: fixed; inset: 0; z-index: 90; pointer-events: none; opacity: 0; transition: opacity .25s; }
  #spotlight.on { opacity: 1; }
  #fx-canvas { position: fixed; inset: 0; z-index: 95; pointer-events: none; }

  /* FX status HUD (present mode) */
  #fx-hud {
    position: fixed; bottom: 16px; left: 16px; z-index: 100; display: none;
    gap: 8px; font-size: 11px;
  }
  body.presenting #fx-hud { display: flex; }
  .fx-chip { padding: 4px 10px; border-radius: 16px; background: rgba(20,27,46,.7); border: 1px solid var(--border); color: var(--muted); backdrop-filter: blur(6px); }
  .fx-chip.on { color: #fff; border-color: var(--accent); background: rgba(99,102,241,.25); }

  /* ════════════ BRANDING (logo + footer on every slide) ════════════ */
  .brand-tr {
    position: absolute; top: 18px; right: 24px; z-index: 8;
    display: flex; flex-direction: column; align-items: flex-end; gap: 4px; text-align: right;
    pointer-events: none;
  }
  .brand-logo { height: 40px; width: auto; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,.4)); }
  .brand-event { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--cyan); opacity: .85; font-weight: 600; }

  .slide-footer {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 7;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 10px 30px; font-size: 11.5px; color: var(--muted);
    border-top: 1px solid rgba(255,255,255,.04);
    background: linear-gradient(0deg, rgba(10,14,26,.55), transparent);
  }
  .slide-footer .foot-links { display: flex; gap: 12px; flex-wrap: wrap; }
  .slide-footer a { color: var(--accent2); text-decoration: none; pointer-events: all; }
  .slide-footer a:hover { color: var(--cyan); text-decoration: underline; }

  /* Title-slide credits block */
  .title-credits { margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .title-credits .by { font-size: clamp(13px,1.6vw,18px); color: #cbd5e1; }
  .title-credits .by b { color: #fff; }
  .title-credits .links { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .title-credits .links a { color: var(--accent2); text-decoration: none; font-size: 13px; padding: 5px 13px; border: 1px solid var(--border); border-radius: 20px; background: rgba(99,102,241,.08); pointer-events: all; transition: all .15s; }
  .title-credits .links a:hover { border-color: var(--accent); color: #fff; background: rgba(99,102,241,.2); }

  /* ════════════ CONFIG PANEL (slide-over) ════════════ */
  #config-panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: 380px; max-width: 92vw; z-index: 300;
    background: var(--bg2); border-left: 1px solid var(--border);
    box-shadow: -16px 0 50px rgba(0,0,0,.5); transform: translateX(100%);
    transition: transform .32s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column;
  }
  #config-panel.open { transform: translateX(0); }
  #config-panel .cfg-head { display: flex; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #config-panel .cfg-head h3 { font-size: 15px; font-weight: 700; color: var(--accent2); flex: 1; }
  #config-panel .cfg-head button { background: var(--bg3); border: none; color: var(--text); width: 30px; height: 30px; border-radius: 8px; cursor: pointer; font-size: 16px; }
  #config-panel .cfg-body { overflow-y: auto; padding: 18px; flex: 1; }
  .cfg-field { margin-bottom: 18px; }
  .cfg-field > label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
  .cfg-field input[type=text], .cfg-field input[type=url], .cfg-field input[type=number] {
    width: 100%; background: #070b15; border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 11px; color: var(--text); font-size: 13px; font-family: var(--font); outline: none;
  }
  .cfg-field input:focus { border-color: var(--accent); }
  .cfg-row { display: flex; gap: 7px; margin-bottom: 7px; align-items: center; }
  .cfg-row input { flex: 1; }
  .cfg-row .cfg-del { background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.3); color: #f87171; width: 32px; height: 34px; border-radius: 8px; cursor: pointer; flex-shrink: 0; }
  .cfg-add { width: 100%; padding: 8px; background: none; border: 1px dashed var(--border); border-radius: 8px; color: var(--muted); font-size: 12px; cursor: pointer; transition: all .15s; }
  .cfg-add:hover { border-color: var(--accent); color: var(--accent2); }
  .cfg-logo-preview { margin-top: 8px; padding: 14px; background: #070b15; border: 1px solid var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; min-height: 56px; }
  .cfg-logo-preview img { max-height: 44px; max-width: 100%; object-fit: contain; }
  #config-panel .cfg-foot { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; gap: 10px; flex-shrink: 0; }
  #config-panel .cfg-foot button { flex: 1; padding: 10px; border-radius: 9px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--font); }
  #config-panel .cfg-save { background: linear-gradient(90deg,var(--accent),#4f46e5); color: #fff; }
  #config-panel .cfg-reset { background: var(--bg3); color: var(--text); }
  .cfg-hint { font-size: 11px; color: #5b6780; line-height: 1.5; margin-top: 4px; }

  /* Export-stage branding */
  #export-brand { position: absolute; top: 22px; right: 30px; z-index: 8; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; text-align: right; }
  #export-brand img { height: 44px; width: auto; object-fit: contain; }
  #export-brand .ev { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #22d3ee; font-weight: 600; }
  #export-foot { position: absolute; left: 0; right: 0; bottom: 0; z-index: 7; display: flex; align-items: center; justify-content: space-between; padding: 12px 34px; font-size: 13px; color: #94a3b8; border-top: 1px solid rgba(255,255,255,.05); }
  #export-foot a { color: #818cf8; text-decoration: none; }
  #export-foot .foot-links { display: flex; gap: 14px; }

  /* ════════════ EDITOR ════════════ */
  #editor-mode { display: none; position: relative; z-index: 3; width: 100vw; height: 100vh; flex-direction: column; background: var(--bg); }
  #editor-mode.open { display: flex; }
  #editor-toolbar { display: flex; align-items: center; gap: 10px; padding: 9px 18px; background: var(--bg2); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #editor-toolbar h2 { font-size: 14px; font-weight: 700; color: var(--accent2); }
  #editor-toolbar .spacer { flex: 1; }
  #editor-body { display: flex; flex: 1; overflow: hidden; }
  #slide-list-panel { width: 230px; flex-shrink: 0; border-right: 1px solid var(--border); overflow-y: auto; background: var(--bg2); padding: 8px; }
  .slide-list-item { padding: 9px 11px; border-radius: 7px; cursor: pointer; margin-bottom: 4px; font-size: 12px; color: var(--muted); border: 1px solid transparent; transition: all .15s; line-height: 1.4; }
  .slide-list-item:hover { background: var(--bg3); color: var(--text); }
  .slide-list-item.active { background: rgba(99,102,241,.2); border-color: var(--accent); color: #fff; }
  .slide-list-item .snum { font-size: 10px; color: var(--accent2); font-weight: 600; display: block; margin-bottom: 2px; }
  #editor-pane { display: flex; flex-direction: column; flex: 1; border-right: 1px solid var(--border); overflow: hidden; }
  #editor-pane .pane-header { padding: 9px 16px; background: var(--bg2); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); flex-shrink: 0; }
  #editor-pane .pane-header code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; color: var(--cyan); }
  #slide-textarea { flex: 1; width: 100%; background: #070b15; color: #e2e8f0; border: none; outline: none; padding: 20px; font-family: var(--mono); font-size: 13px; line-height: 1.7; resize: none; tab-size: 2; }
  #preview-pane { flex: 1; overflow-y: auto; padding: 28px 36px; background: #060a13; }
  #preview-pane .pane-header { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
  #add-slide-btn { width: 100%; margin-top: 8px; padding: 9px; background: none; border: 1px dashed var(--border); border-radius: 7px; color: var(--muted); font-size: 12px; cursor: pointer; transition: all .15s; }
  #add-slide-btn:hover { border-color: var(--accent); color: var(--accent2); }

  /* Toast */
  #toast { position: fixed; top: 64px; right: 18px; background: var(--accent); color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 13px; font-weight: 600; transform: translateX(160%); transition: transform .3s cubic-bezier(.2,.8,.2,1); z-index: 999; box-shadow: 0 10px 30px rgba(99,102,241,.4); }
  #toast.show { transform: translateX(0); }

  /* Off-screen export stage (fixed 1280x720 for pixel-consistent PNG/PPTX/PDF) */
  #export-stage {
    position: fixed; left: -10000px; top: 0; width: 1280px; height: 720px;
    background: radial-gradient(ellipse at 70% 20%, #16203a 0%, #0a0e1a 60%);
    overflow: hidden; display: flex; align-items: center; justify-content: center; z-index: -1;
  }
  #export-content { width: 100%; max-width: 1120px; padding: 50px 70px; transform-origin: center center; }
  .export-md { text-align: left; }
  .export-md.title, .export-md.part { text-align: center; }
  .export-tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--cyan); margin-bottom: 18px; padding: 4px 12px; border: 1px solid rgba(34,211,238,.3); border-radius: 20px; background: rgba(34,211,238,.07); }

{tag:'', type:'title', raw:`# KS Business
## The BD analyst that does 3 hours of research in 30 seconds

{tag:'PART 1 — THE NARRATIVE', type:'part', raw:`# PART 1 — THE NARRATIVE
## Problem → Insight → Solution → Proof`},

{tag:'Slide 2', type:'', raw:`## Business development doesn't scale

A typical outbound rep spends **2–3 hours per prospect** before writing a single word:

| Step | Time sink |
|------|-----------|
| 🔍 Google the company, open 10 tabs | 30 min |
| 💼 Hunt LinkedIn for the right decision-makers | 40 min |
| 📰 Read blogs, press, job posts for pain signals | 45 min |
| 🧩 Stitch a narrative: their problem ↔ your solution | 30 min |
| ✍️ Write an email that *still* sounds generic | 20 min |

**Result:** inconsistent output, missed signals, dismal reply rates.
Hiring more reps multiplies the cost — never the quality.

> 🎤 "Raise your hand if you've sent an email that opened with 'I hope this finds you well.' That email got ignored — and in a minute I'll show you why, in code."`},

{tag:'Slide 3', type:'', raw:`## Generic AI tools *hallucinate* personalization

Most "AI email writers" take a name and fabricate a plausible-sounding hook.
The prospect can smell it. Reply rates stay flat.

**The email that actually works references a real, specific, recent signal:**

> *"Saw you've had 12 React roles open 78+ days while sunsetting your legacy billing stack — that backlog compounds fast before a Q3 deadline."*

That sentence is impossible without **evidence**. You cannot prompt your way to it — you have to **go get the data first**.

> 🎤 "This is the whole thesis. Specificity beats fluency. And specificity requires grounding — which is an *engineering* problem, not a prompt-writing problem."`},

{tag:'Slide 4', type:'', raw:`## Three engineering bets

1. **Gather in parallel, not in sequence.**
   Research is I/O-bound. Fire every scraper and searcher *concurrently* — cut 25 seconds of serial work to ~5 seconds wall-clock.

2. **Swarm the people problem.**
   Don't enrich 6 decision-makers one at a time. Launch **one agent per person, in parallel**, each bounded by a semaphore.

3. **Ground every claim in retrieved evidence (RAG).**
   Never stuff 15,000 characters into one prompt. Chunk everything, embed it, retrieve only the top-k relevant pieces per question, and force the LLM to **quote the source** — or say "Unknown."

> 🎤 "These three bets — parallelism, the swarm, and RAG groundedness — are what make this a system, not a prompt. The rest of the deck shows each one in the code."`},

{tag:'Slide 5', type:'', raw:`## One company name in → a full BD playbook out

You give it: **company name + what you sell + (optional) URL.**

KS Business runs a **15-agent pipeline** that gathers concurrently, pauses for your review, synthesizes evidence-first intelligence, and writes outreach anchored on a real signal — in **~30 seconds**, on **free-tier infrastructure**.

\`\`\`
company name ──► 15 agents ──► evidence report ──► grounded outreach ──► outcome learning
                (parallel)      (RAG-grounded)     (specificity-enforced)  (compounds)
\`\`\`

> 🎤 Land the human checkpoint here as the differentiator — "we keep the rep's judgment in the loop, we don't replace it."`},

{tag:'PART 2 — HOW WE SOLVED IT', type:'part', raw:`# PART 2 — HOW WE SOLVED IT
## The three engineering bets, in code`},

{tag:'Slide 6', type:'', raw:`## Multi-agent system, not a single prompt

\`\`\`
Browser (Next.js 15 · JWT cookie auth)
        │
        ▼
FastAPI ──► Orchestrator (asyncio background task — returns pipeline_id instantly)
        │
   ┌────┴───────────────────────────────────────┐
   │  PHASE 1 — GATHER   (status: gathering)     │
   │  asyncio.gather → website · linkedin ·      │
   │                    posts · jobs             │
   │  PeopleSwarmAgent → 1 agent / person        │
   │  keywords → (research ∥ crawl) → RAG index  │
   └────┬───────────────────────────────────────┘
        ▼
   ⏸ HUMAN CHECKPOINT   (status: awaiting_input)
        ▼
   ┌─────────────────────────────────────────────┐
   │  PHASE 2 — SYNTHESIZE   (status: insights)  │
   │  RAG retrieve → InsightsAgent → embed        │
   └────┬────────────────────────────────────────┘
        ▼
   ON DEMAND: POC plan · 5-type outreach · pitch assets · deal outcome
        ▼
   Market Intelligence (Qdrant clustering across all companies)
\`\`\`

**11 pipeline states:** \`pending → gathering → people → keywords → researching → indexing → awaiting_input → insights → embedding → complete\` (or \`failed\`).

> 🎤 "The endpoint returns a pipeline_id in milliseconds. Everything heavy runs as an asyncio.create_task in the background while the UI polls. The event loop never blocks."`},

{tag:'Slide 7', type:'', raw:`## Bet #1 — Parallel Processing
### Gather concurrently — 4 agents fire at once

The instant gathering starts, four scrapers run in parallel — verbatim from \`pipeline.py\`:

\`\`\`python
scraper_result, linkedin_result, posts_result, jobs_result = await asyncio.gather(
    _to_thread(lambda: WebsiteScraperAgent().run(company_name, company_url)),
    _to_thread(lambda: LinkedInAgent().run(company_name, linkedin_url)),
    _to_thread(lambda: LinkedInPostsAgent().run(company_name, post_lookback_months, post_limit, company_url)),
    _to_thread(lambda: JobsAgent().run(company_name, company_url)),
)
\`\`\`

Then **web research and a broad crawl run in parallel too:**

\`\`\`python
research, crawl = await asyncio.gather(
    _to_thread(lambda: WebResearchAgent().run(company_name, keywords, company_url)),
    _to_thread(lambda: WebCrawlerAgent().run(company_name, company_url, keywords)),
)
\`\`\`

\`_to_thread\` offloads each blocking agent onto a thread-pool executor, so synchronous scraping never stalls the async event loop.

**Impact:** ~25s of serial scraping → **~5s wall-clock.**

> 🎤 "Research is I/O-bound — you're waiting on network, not CPU. So we never wait serially. Four sources at once, then research and crawl at once."`},

{tag:'Slide 8', type:'', raw:`## Bet #2 — The People Swarm
### One enrichment agent per person, in parallel

We don't enrich decision-makers one at a time. \`PeopleSwarmAgent\` launches a **bounded swarm** — verbatim from \`people.py\`:

\`\`\`python
sem = asyncio.Semaphore(concurrency)          # default concurrency = 4

async def _guarded(p):
    async with sem:
        return await self._enrich(p, company_name, user_description)

tasks = [_guarded(p) for p in people]          # max_people = 6
enriched = await asyncio.gather(*tasks, return_exceptions=True)
\`\`\`

Each agent independently extracts, at **temperature 0.0** (deterministic):

- \`role_category\` — one of 10 (Executive, Engineering, Product, Sales/BD, …)
- \`seniority\` — C-Level / VP / Director / Manager / IC / Unknown
- \`location\`, \`relevance\` (one-sentence BD entry point), \`confidence\`

**Anti-hallucination guardrail (system prompt, verbatim):**
> *"Never invent a location, title, or detail absent from the snippet. If a detail is not present, return 'Unknown'."*

> 🎤 "Six people, enriched simultaneously, capped at 4 in-flight so we never trip Groq's rate limit. return_exceptions=True means one person failing never sinks the batch."`},

{tag:'Slide 9', type:'', raw:`## Bet #3 — RAG Groundedness
### We retrieve evidence — we don't stuff context

**Index:** every gathered fact is chunked to **~600 characters** and embedded with **\`BAAI/bge-small-en-v1.5\`** (384-dim, ONNX, CPU, no API key), into Qdrant collection \`ks_business_rag\`.

**Per-pipeline namespace** — each run's data is isolated by a payload filter:

\`\`\`python
flt = Filter(must=[FieldCondition(key="pipeline_id",
                                  match=MatchValue(value=pipeline_id))])
\`\`\`

**The LLM writes its own retrieval queries** — 6 short queries, 3–7 words each — then we embed each and pull the **top-k = 4** chunks per query, deduplicated:

\`\`\`python
def retrieve(self, pipeline_id, queries, k=4):
    for q in queries:
        vec = embed_one(q)
        hits = self._client.search(
            collection_name=COLLECTION, query_vector=vec,
            query_filter=flt, limit=k, with_payload=True,
        )
\`\`\`

The synthesis prompt then sees a **compact, high-signal, ≤5,500-char** context block — not a 15K-char dump.

> 🎤 "This is classic retrieve-then-synthesize RAG. The model reasons over chunks we fetched from real data — it can't hallucinate a fact that isn't in the retrieved evidence."`},

{tag:'Slide 10', type:'', raw:`## The Human Checkpoint
### A quality gate, not a UX nicety

After gathering, the pipeline saves everything and **pauses** at \`awaiting_input\`:

\`\`\`python
save_gathered(pipeline_id, gathered)
update_pipeline_status(pipeline_id, "awaiting_input")
\`\`\`

The reviewer can, before any synthesis happens:
- **\`removed_people\`** — drop irrelevant names from the swarm output
- **\`excluded_items\`** — exclude noisy posts / jobs / crawl / research **by index**
- **\`human_input\`** — inject free-text context the agents couldn't find

Then \`/continue\` flips status to \`insights\` and launches synthesis as a fresh background task.

> 🎤 "Garbage in, garbage out. Pruning noise *before* the LLM synthesizes directly improves the evidence it reasons over. This is the highest-leverage 10 seconds in the whole flow."`},

{tag:'Slide 11', type:'', raw:`## Specificity, Enforced in Code
### We ban generic language at the prompt layer

Groundedness gets the facts right. **Specificity enforcement** makes the *output* sharp.

**Insights agent — 16 banned phrases**, e.g.:
~~"digital transformation"~~ · ~~"proven track record"~~ · ~~"best-in-class"~~ · ~~"synergy"~~ · ~~"cutting-edge"~~

Every pain point must **quote the actual signal verbatim:**

> BAD: "Company announced layoffs"

> GOOD: *"LinkedIn headline: 'Acrisure to Cut 2,250 Employees, Citing Advances in Technology and AI'"*

**Email generator — 14 banned phrases**, e.g.:
~~"Hope you're doing well"~~ · ~~"My name is"~~ · ~~"Just following up"~~ · ~~"Circling back"~~ · ~~"leverage"~~

Bound by the **EMAIL_PLAYBOOK**: subject 3–5 words, body 50–110 words (70% their world / 30% your offering), **exactly one** low-friction CTA, 5th–7th-grade reading level.

> 🎤 Read two banned phrases aloud. The room laughs in recognition — that's buy-in. "We don't *hope* the model avoids clichés. We forbid them, by name, in the prompt."`},

{tag:'Slide 12', type:'', raw:`## 5-Type Outreach + Persona Targeting
### The right message, for the right channel, for the right buyer

**5 message types** — each a purpose-built prompt config:

| Type | Channel | Hard limit |
|------|---------|-----------|
| \`cold_email\` | email | 60–100 words |
| \`follow_up_email\` | email | 40–60 words, *different angle* |
| \`linkedin_message\` | LinkedIn | 300–500 chars |
| \`linkedin_connection\` | LinkedIn | **280 chars** |
| \`call_script\` | phone | 30s open + 20s voicemail |

**Configurable length:** user types any value **50 → 500 words** →
\`"Write the message in exactly {word_limit} words (±10%). Do not exceed {word_limit} words."\`

**Persona detection** from the prospect's title routes to a tailored angle:
technical → architecture & tech-debt · financial → ROI & payback · strategic → market position

> 🎤 "A connection request and a CFO cold email follow completely different rules. One generator can't do both well — so we built five, each with its own playbook."`},

{tag:'Slide 13', type:'', raw:`## The Feedback Loop
### It compounds with every deal

\`\`\`
Outreach sent ──► Deal outcome logged
   (won · lost · no_response · meeting_booked)
        │
        ▼
ICP calibration dataset  ──►  future scoring sharpens (no manual tuning)
        │
        ▼
Every researched company embedded into a shared Qdrant collection
        │
        ▼
Market Intelligence: industry-clustered trend themes + cross-portfolio BD opportunities
\`\`\`

Trends unlock at **≥ 3 companies**, group by industry into **≤ 5 clusters**, each summarized by the LLM into a \`theme / insight / opportunity\`.

> 🎤 "A demo is a moment. A learning loop is a business. The more you use it, the sharper the ICP scoring and the richer the market map get."`},

{tag:'Slide 14', type:'', raw:`## Graceful Degradation
### No single point of failure

Every external source can fail — and the pipeline shrugs and continues:

- **Phase-level guards** — gather and synthesize each wrapped in try/except; failure → \`failed\` status with the real error stored, not a crash.
- **Swarm & parallel fetches** use \`asyncio.gather(..., return_exceptions=True)\` — one dead source is filtered out, the rest aggregate.
- **Bulk generation** wraps *each* prospect — one failure returns \`{"error": ...}\` for that prospect only; others complete.
- **Embedder/Qdrant unavailable** → singleton returns \`None\`, RAG silently degrades to direct context, pipeline still completes.
- **LLM cluster failure** → falls back to a data-derived cluster (industry + company count + top keywords).

> 🎤 "If LinkedIn rate-limits us mid-run, we keep going on website + jobs + research. Robustness isn't a feature we added — it's wrapped around every agent."`},

{tag:'PART 3 — PROOF & CLOSE', type:'part', raw:`# PART 3 — PROOF & CLOSE`},

{tag:'Slide 15', type:'', raw:`## 🎬 Live Demo — Cold company → closed-ready, in 30 seconds

| Step | What the judge sees | Time |
|------|--------------------|------|
| 1 | Enter "Stripe" + "We sell fraud-detection APIs" | 0:00 |

> 🎤 **Rehearse cold. Pre-warm the cache. Have a backup recording.** The "Anchored on" badge is the wow moment — narrate it.`},

{tag:'Slide 16', type:'', raw:`## Tech Stack — Built to Run on $0

| Layer | Choice | Why |
|-------|--------|-----|
| LLM | **Groq** \`llama-3.3-70b-versatile\` | ~400 tok/s, free tier |

✅ **Zero paid APIs anywhere. Production-grade system on a hackathon budget.**

> 🎤 "We built this without spending a rupee on infrastructure. Judges reward resourcefulness — and it means anyone can run it tomorrow."`},

{tag:'Slide 17', type:'', raw:`## Engineering Highlights
### Production-grade, not a hackathon hack

- 🔀 **Three layers of concurrency** — \`asyncio.gather\` (4 scrapers), the **People Swarm** (semaphore-bounded), parallel research+crawl, and \`Semaphore(3)\` on bulk LLM calls
- 🧠 **RAG-grounded synthesis** — LLM-authored queries, top-k=4 retrieval, per-pipeline Qdrant namespaces, ≤5,500-char context
- 🛡️ **Graceful degradation** — every agent isolated; partial results always surface
- 🎯 **Specificity enforced** — 16 + 14 banned phrases, verbatim-evidence rules, the EMAIL_PLAYBOOK
- 🔁 **Outcome learning** — deal outcomes → ICP calibration; cumulative market clustering
- ✅ **TypeScript strict mode, zero errors**

> 🎤 Pick the two that fit your judges. Technical panel → concurrency + RAG. Product panel → specificity + the loop.`},

{tag:'Slide 18', type:'', raw:`## Market & Impact
### The ROI is time reclaimed

- **Outbound BD / SDR teams** — 10× research throughput

## Deep Technical Q&A Bank`},

{tag:'Q&A — Part 1', type:'', raw:`## Deep Technical Q&A (1/2)

**Q: How is this different from Apollo / Clay / Lavender?**
> Those are point tools — a contact database, or an email assistant. We're an end-to-end *grounded* pipeline: parallel research → RAG-evidenced synthesis → specificity-enforced outreach → outcome learning, with a human checkpoint. And it runs entirely free-tier.

**Q: Does it hallucinate?**
> By design, no. We RAG-ground synthesis against retrieved chunks, the people-swarm prompt forbids inventing any detail ("return 'Unknown'"), pain points must quote the verbatim signal, and the UI surfaces evidence chips + the "Anchored on" signal.

**Q: Walk me through the concurrency.**
> Three layers. (1) Gathering: \`asyncio.gather\` over four scrapers, plus a parallel research+crawl. (2) The People Swarm: one agent per person, bounded by \`asyncio.Semaphore(4)\`, max 6 people, \`return_exceptions=True\`. (3) Activation: A/B email tones via \`gather\`, and bulk generation capped at \`Semaphore(3)\` to respect Groq's rate limit. Blocking agent work is offloaded with \`run_in_executor\`, and the whole pipeline launches as an \`asyncio.create_task\` so the endpoint returns instantly.

**Q: How exactly does the RAG work?**
> Index: chunk every gathered fact to ~600 chars, embed with \`bge-small-en-v1.5\` (384-dim), upsert into Qdrant \`ks_business_rag\` with a \`pipeline_id\` payload index. Retrieve: the LLM writes 6 short queries, we embed each and pull top-k=4 chunks per query, dedup, and assemble a ≤5,500-char context. Re-indexing is idempotent — prior chunks for the pipeline are deleted first.`},

{tag:'Q&A — Part 2', type:'', raw:`## Deep Technical Q&A (2/2)

**Q: Why a vector DB per pipeline instead of one big prompt?**
> A 15K-char dump dilutes signal and risks context-length errors. Retrieving only the top-k relevant chunks per question keeps the synthesis context compact and high-signal.

**Q: What if LinkedIn blocks you?**
> Each agent degrades independently. A LinkedIn 429 returns empty LinkedIn data; the pipeline continues on website + jobs + research. \`return_exceptions=True\` on the parallel fetches means a single failure is filtered out, not propagated.

**Q: Is the data legal / accurate?**
> Public-web scraping only — no auth-walled content. The human checkpoint lets the user verify and prune before anything is synthesized.

**Q: How does specificity get enforced — isn't that just a nice prompt?**
> It's explicit. 16 banned phrases in the insights agent, 14 in the email generator, an EMAIL_PLAYBOOK with hard word/CTA/reading-level rules, and format rules requiring verbatim evidence quotes and copy-paste-ready pitch angles.

**Q: How does it improve over time?**
> Deal outcomes (won/lost/no_response/meeting_booked) feed an ICP calibration dataset. Every completed company is embedded into a shared collection and clustered by industry (≤5 clusters, unlocks at 3 companies) into market-trend themes.

**Q: What's actually free vs. paid?**
> Everything is free or free-tier: Groq (free tier), Qdrant Cloud (free tier), fastembed (local ONNX, no key), DuckDuckGo (keyless), SQLite (stdlib). Optional paid enrichment (Apollo/Hunter) is supported but **never required** — it falls back to email-pattern inference.`},

// ═══════════════════════════════════════════════════════════
//  MARKDOWN RENDERER
// ═══════════════════════════════════════════════════════════
function renderMd(raw) {
  let text = raw;

  // Extract speaker notes (blockquotes starting with 🎤)
  // We handle blockquotes specially — keep them in the render

  // Escape HTML entities first (but we'll un-escape inside code blocks)
  // Actually handle code blocks first before any other processing
  const codeBlocks = [];
  text = text.replace(/```[\s\S]*?```/g, (match) => {
    const idx = codeBlocks.length;
    const lang = match.match(/^```(\w*)/)?.[1] || '';
    const code = match.replace(/^```\w*\n?/, '').replace(/```$/, '');
    const escaped = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    codeBlocks.push(`<pre><code>${escaped}</code></pre>`);
    return `\x00CODE${idx}\x00`;
  });

  // Inline code
  const inlineCodes = [];
  text = text.replace(/`([^`]+)`/g, (_, c) => {
    const idx = inlineCodes.length;
    const escaped = c.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    inlineCodes.push(`<code>${escaped}</code>`);
    return `\x00INLINE${idx}\x00`;
  });

  // Escape HTML
  text = text.replace(/&(?!amp;|lt;|gt;|quot;|#)/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // Headers
  text = text.replace(/^#{4}\s+(.+)$/gm, '<h4>$1</h4>');
  text = text.replace(/^#{3}\s+(.+)$/gm, '<h3>$1</h3>');
  text = text.replace(/^#{2}\s+(.+)$/gm, '<h2>$1</h2>');
  text = text.replace(/^#{1}\s+(.+)$/gm, '<h1>$1</h1>');

  // Horizontal rule
  text = text.replace(/^---$/gm, '<hr>');

  // Tables
  text = text.replace(/((\|.+\|\n?)+)/g, (block) => {
    const lines = block.trim().split('\n').filter(l => l.trim());
    if (lines.length < 2) return block;
    const isHeaderSep = (l) => /^\|[\s\-:|]+\|$/.test(l.replace(/\s/g,''));
    let html = '<table>';
    let inBody = false;
    for (let i = 0; i < lines.length; i++) {
      const cells = lines[i].split('|').slice(1,-1).map(c => c.trim());
      if (isHeaderSep(lines[i])) { html += '</tr><tbody>'; inBody = true; continue; }
      const tag = (!inBody && i === 0) ? 'th' : 'td';
      if (!inBody && i === 0) html += '<thead><tr>';
      else if (inBody) html += '<tr>';
      html += cells.map(c => `<${tag}>${c}</${tag}>`).join('');
      if (!inBody && i === 0) html += '</tr></thead>';
      else if (inBody) html += '</tr>';
    }
    html += '</tbody></table>';
    return html;
  });

  // Blockquotes (multi-line)
  text = text.replace(/(^&gt;.+(\n&gt;.*)*)/gm, (match) => {
    const content = match.replace(/^&gt;\s?/gm, '').trim();
    return `<blockquote><p>${content}</p></blockquote>`;
  });

  // Strikethrough
  text = text.replace(/~~(.+?)~~/g, '<del>$1</del>');

  // Bold
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

  // Italic
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');

  // Unordered lists (handle nested)
  text = text.replace(/(^[\-\*] .+(\n[\-\*] .+)*)/gm, (block) => {
    const items = block.split('\n').filter(l => l.trim()).map(l => `<li>${l.replace(/^[\-\*]\s+/,'')}</li>`).join('');
    return `<ul>${items}</ul>`;
  });

  // Ordered lists
  text = text.replace(/(^\d+\. .+(\n\d+\. .+)*)/gm, (block) => {
    const items = block.split('\n').filter(l => l.trim()).map(l => `<li>${l.replace(/^\d+\.\s+/,'')}</li>`).join('');
    return `<ol>${items}</ol>`;
  });

  // Paragraphs — blank lines separate
  const parts = text.split(/\n\s*\n/);
  text = parts.map(p => {
    p = p.trim();
    if (!p) return '';
    if (/^<(h[1-6]|ul|ol|table|blockquote|pre|hr)/.test(p)) return p;
    return `<p>${p.replace(/\n/g,'<br>')}</p>`;
  }).join('\n');

  // Restore code blocks
  codeBlocks.forEach((code, i) => { text = text.replace(`\x00CODE${i}\x00`, code); });
  inlineCodes.forEach((code, i) => { text = text.replace(`\x00INLINE${i}\x00`, code); });

  return text;
}

// Extract speaker notes from raw (blockquotes with 🎤)
function extractNotes(raw) {
  const lines = raw.split('\n');
  const noteLines = [];
  let inNote = false;
  for (const line of lines) {
    if (/^>\s*🎤/.test(line)) { inNote = true; noteLines.push(line.replace(/^>\s*🎤\s*/,'')); }
    else if (inNote && /^>\s*/.test(line)) { noteLines.push(line.replace(/^>\s*/,'')); }
    else { inNote = false; }
  }
  return noteLines.join(' ').trim();
}

function buildPresentation() {
  const wrapper = document.getElementById('slides-wrapper');
  wrapper.innerHTML = '';
  slides.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'slide' +
      (s.type === 'title' ? ' title-slide' : '') +
      (s.type === 'part' ? ' part-divider' : '') +
      (i === currentSlide ? ' active' : '');
    div.id = `slide-${i}`;
    let inner = brandTopRight();
    if (s.tag && s.type !== 'part') inner += `<div class="slide-tag">${escHtml(s.tag)}</div>`;
    let body = renderMd(stripNotes(s.raw));
    if (s.type === 'title') body += titleCredits();
    inner += `<div class="slide-inner md">${body}</div>`;
    inner += slideFooter();
    div.innerHTML = inner;
    wrapper.appendChild(div);
  });
  buildDots();
  updateToolbar();
}

function buildDots() {
  const dots = document.getElementById('dots');
  dots.innerHTML = slides.map((_, i) =>
    `<div class="dot${i===currentSlide?' active':''}" onclick="goTo(${i})" title="Slide ${i+1}"></div>`
  ).join('');
}

function updateToolbar() {
  document.getElementById('slide-counter').textContent = `${currentSlide+1} / ${slides.length}`;
  document.getElementById('progress-fill').style.width = `${((currentSlide+1)/slides.length)*100}%`;
  const s = slides[currentSlide];
  document.getElementById('part-label').textContent = s.tag || '';
  document.getElementById('notes-text').textContent = extractNotes(s.raw) || '(No speaker notes for this slide)';
}

function goTo(idx) {
  if (idx < 0 || idx >= slides.length || idx === currentSlide) return;
  const prev = document.getElementById(`slide-${currentSlide}`);
  if (prev) { prev.classList.add('leaving'); prev.classList.remove('active');
    setTimeout(() => prev && prev.classList.remove('leaving'), 500); }
  currentSlide = idx;
  const next = document.getElementById(`slide-${currentSlide}`);
  if (next) {
    // restart entrance animation
    next.classList.remove('active'); void next.offsetWidth; next.classList.add('active');
  }
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === currentSlide));
  updateToolbar();
  pulseBackground();
}

// ═══════════════════════════════════════════════════════════
//  THREE.JS NETWORK BACKGROUND  (on-theme: a multi-agent mesh)
// ═══════════════════════════════════════════════════════════
let three = { ok:false };
function initThree() {
  if (!window.THREE) return;
  const canvas = document.getElementById('bg-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(62, window.innerWidth/window.innerHeight, 1, 2000);
  camera.position.z = 460;

  const N = 95, R = 420;
  const pos = new Float32Array(N*3);
  const vel = [];
  for (let i=0;i<N;i++){
    pos[i*3]   = (Math.random()*2-1)*R;
    pos[i*3+1] = (Math.random()*2-1)*R*0.6;
    pos[i*3+2] = (Math.random()*2-1)*R*0.5;
    vel.push([(Math.random()*2-1)*0.35,(Math.random()*2-1)*0.35,(Math.random()*2-1)*0.35]);
  }
  const group = new THREE.Group(); scene.add(group);

  // Nodes
  const nodeGeo = new THREE.BufferGeometry();
  nodeGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const nodeMat = new THREE.PointsMaterial({ color:0x818cf8, size:4.2, transparent:true, opacity:0.9, blending:THREE.AdditiveBlending, depthWrite:false });
  const points = new THREE.Points(nodeGeo, nodeMat);
  group.add(points);

  // Lines (preallocated)
  const maxSeg = N*N;
  const linePos = new Float32Array(maxSeg*3);
  const lineGeo = new THREE.BufferGeometry();
  lineGeo.setAttribute('position', new THREE.BufferAttribute(linePos, 3));
  const lineMat = new THREE.LineBasicMaterial({ color:0x6366f1, transparent:true, opacity:0.18, blending:THREE.AdditiveBlending, depthWrite:false });
  const lines = new THREE.LineSegments(lineGeo, lineMat);
  group.add(lines);

  const DIST = 135, DIST2 = DIST*DIST;
  let mx = 0, my = 0;
  window.addEventListener('mousemove', e => { mx = (e.clientX/window.innerWidth-0.5); my = (e.clientY/window.innerHeight-0.5); });

  three = { ok:true, renderer, scene, camera, group, pos, vel, nodeGeo, lineGeo, linePos, points, lines, N, R, DIST2, pulse:0,
    getMouse:()=>({mx,my}) };

  window.addEventListener('resize', () => {
    if (!three.ok) return;
    camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animateThree();
}

function pulseBackground(){ if (three.ok) three.pulse = 1; }

function animateThree() {
  if (!three.ok) return;
  requestAnimationFrame(animateThree);
  const { pos, vel, N, R, DIST2, linePos, nodeGeo, lineGeo, group, camera, renderer, scene } = three;
  // move nodes
  for (let i=0;i<N;i++){
    for (let a=0;a<3;a++){
      const k=i*3+a; pos[k]+=vel[i][a];
      const lim = a===0?R : a===1?R*0.6 : R*0.5;
      if (pos[k]>lim||pos[k]<-lim) vel[i][a]*=-1;
    }
  }
  // rebuild lines
  let seg=0;
  for (let i=0;i<N;i++){
    const xi=pos[i*3], yi=pos[i*3+1], zi=pos[i*3+2];
    for (let j=i+1;j<N;j++){
      const dx=xi-pos[j*3], dy=yi-pos[j*3+1], dz=zi-pos[j*3+2];
      if (dx*dx+dy*dy+dz*dz < DIST2){
        linePos[seg*3]=xi; linePos[seg*3+1]=yi; linePos[seg*3+2]=zi; seg++;
        linePos[seg*3]=pos[j*3]; linePos[seg*3+1]=pos[j*3+1]; linePos[seg*3+2]=pos[j*3+2]; seg++;
      }
    }
  }
  nodeGeo.attributes.position.needsUpdate = true;
  lineGeo.setDrawRange(0, seg);
  lineGeo.attributes.position.needsUpdate = true;

  // gentle rotation + mouse parallax + slide-change pulse
  const { mx, my } = three.getMouse();
  group.rotation.y += 0.0009;
  group.rotation.x += (my*0.25 - group.rotation.x)*0.04;
  group.rotation.y += (mx*0.0008);
  if (three.pulse > 0){
    three.pulse *= 0.92;
    three.points.material.opacity = 0.9 + three.pulse*0.6;
    three.lines.material.opacity = 0.18 + three.pulse*0.35;
    camera.position.z = 460 - three.pulse*30;
    if (three.pulse < 0.01){ three.pulse = 0; three.points.material.opacity=0.9; three.lines.material.opacity=0.18; camera.position.z=460; }
  }
  renderer.render(scene, camera);
}

// ═══════════════════════════════════════════════════════════
//  POINTER FX  (laser pointer · glow · spotlight · trail)
// ═══════════════════════════════════════════════════════════
let pointerOn = false, glowOn = false, spotOn = false;
let mouse = { x: window.innerWidth/2, y: window.innerHeight/2 };
const trail = [];
const fxCanvas = document.getElementById('fx-canvas');
const fxCtx = fxCanvas.getContext('2d');
const spotlight = document.getElementById('spotlight');
let fxRunning = false;

function sizeFxCanvas(){
  const dpr = Math.min(window.devicePixelRatio, 2);
  fxCanvas.width = window.innerWidth*dpr; fxCanvas.height = window.innerHeight*dpr;
  fxCanvas.style.width = window.innerWidth+'px'; fxCanvas.style.height = window.innerHeight+'px';
  fxCtx.setTransform(dpr,0,0,dpr,0,0);
}
sizeFxCanvas();
window.addEventListener('resize', sizeFxCanvas);

window.addEventListener('mousemove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  if (pointerOn){
    const last = trail[trail.length-1];
    if (!last || Math.hypot(e.clientX-last.x, e.clientY-last.y) > 3)
      trail.push({ x:e.clientX, y:e.clientY, t:performance.now() });
  }
  if (spotOn) updateSpotlight();
});

function updateSpotlight(){
  const r = 170;
  spotlight.style.background =
    `radial-gradient(circle ${r}px at ${mouse.x}px ${mouse.y}px, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 60%, rgba(5,8,16,0.82) 100%)`;
}

function startFx(){ if (fxRunning) return; fxRunning = true; fxLoop(); }
function fxLoop(){
  if (!fxRunning) return;
  requestAnimationFrame(fxLoop);
  fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height);
  if (!pointerOn) return;
  const now = performance.now();
  while (trail.length && now - trail[0].t > 520) trail.shift();
  // comet trail
  for (let i=1;i<trail.length;i++){
    const a = i/trail.length;
    fxCtx.strokeStyle = `rgba(255,64,64,${a*0.55})`;
    fxCtx.lineWidth = a*9; fxCtx.lineCap = 'round';
    fxCtx.beginPath(); fxCtx.moveTo(trail[i-1].x, trail[i-1].y); fxCtx.lineTo(trail[i].x, trail[i].y); fxCtx.stroke();
  }
  // main dot
  fxCtx.save();
  if (glowOn){ fxCtx.shadowColor = 'rgba(255,40,40,0.95)'; fxCtx.shadowBlur = 34; }
  const grd = fxCtx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,glowOn?16:9);
  grd.addColorStop(0,'#ffd0d0'); grd.addColorStop(0.4,'#ff3b3b'); grd.addColorStop(1,'rgba(255,59,59,0)');
  fxCtx.fillStyle = grd;
  fxCtx.beginPath(); fxCtx.arc(mouse.x, mouse.y, glowOn?16:9, 0, Math.PI*2); fxCtx.fill();
  fxCtx.fillStyle = '#fff';
  fxCtx.beginPath(); fxCtx.arc(mouse.x, mouse.y, 2.5, 0, Math.PI*2); fxCtx.fill();
  fxCtx.restore();
}

function togglePointer(){
  pointerOn = !pointerOn; if (pointerOn) startFx();
  document.body.classList.toggle('pointer-on', pointerOn && document.body.classList.contains('presenting'));
  if (!pointerOn) trail.length = 0;
  // pointer needs presenting class for cursor:none; ensure fx works even windowed
  document.body.classList.toggle('pointer-on', pointerOn);
  updateFxHud(); showToast(pointerOn ? '🔴 Laser pointer ON' : 'Pointer off');
}
function toggleGlow(){ glowOn = !glowOn; updateFxHud(); showToast(glowOn ? '✨ Glow ON' : 'Glow off'); }
function toggleSpotlight(){ spotOn = !spotOn; spotlight.classList.toggle('on', spotOn); if (spotOn) updateSpotlight(); updateFxHud(); showToast(spotOn ? '🔦 Spotlight ON' : 'Spotlight off'); }
function updateFxHud(){
  document.getElementById('chip-pointer').classList.toggle('on', pointerOn);
  document.getElementById('chip-glow').classList.toggle('on', glowOn);
  document.getElementById('chip-spot').classList.toggle('on', spotOn);
}

// ═══════════════════════════════════════════════════════════
//  NOTES
// ═══════════════════════════════════════════════════════════
function toggleNotes(){ notesOpen = !notesOpen; document.getElementById('notes-panel').classList.toggle('open', notesOpen); document.getElementById('notes-btn').classList.toggle('active', notesOpen); }

// ═══════════════════════════════════════════════════════════
//  EDITOR
// ═══════════════════════════════════════════════════════════
function openEditor(){ editorSlide = currentSlide; document.getElementById('app').classList.add('edit-open'); document.getElementById('editor-mode').classList.add('open'); buildSlideList(); loadEditorSlide(editorSlide); }
function closeEditor(){ document.getElementById('app').classList.remove('edit-open'); document.getElementById('editor-mode').classList.remove('open'); buildPresentation(); currentSlide = Math.min(editorSlide, slides.length-1); buildPresentation(); }
function buildSlideList(){
  document.getElementById('slide-list-inner').innerHTML = slides.map((s, i) => {
    const title = (s.raw.match(/^#{1,3}\s+(.+)/m)?.[1] || s.tag || `Slide ${i+1}`).replace(/[*`]/g,'');
    return `<div class="slide-list-item${i===editorSlide?' active':''}" onclick="loadEditorSlide(${i})"><span class="snum">SLIDE ${i+1}</span>${escHtml(title.substring(0,58))}</div>`;
  }).join('');
}
function loadEditorSlide(idx){ editorSlide = idx; document.getElementById('slide-textarea').value = slides[idx].raw; updateLivePreview(); document.querySelectorAll('.slide-list-item').forEach((el,i)=>el.classList.toggle('active', i===idx)); }
function onEditorInput(){ slides[editorSlide].raw = document.getElementById('slide-textarea').value; updateLivePreview(); }
function updateLivePreview(){ document.getElementById('live-preview').innerHTML = renderMd(slides[editorSlide].raw); }
function addSlide(){ slides.splice(editorSlide+1,0,{tag:`Slide ${slides.length+1}`,type:'',raw:`## New Slide\n\nWrite your content here.\n\n> 🎤 Speaker notes go here.`}); buildSlideList(); loadEditorSlide(editorSlide+1); showToast('Slide added'); }
function deleteCurrentSlide(){ if (slides.length<=1){ showToast('Cannot delete the last slide'); return; } if (!confirm(`Delete slide ${editorSlide+1}?`)) return; slides.splice(editorSlide,1); editorSlide=Math.min(editorSlide,slides.length-1); buildSlideList(); loadEditorSlide(editorSlide); showToast('Slide deleted'); }
function moveSlide(dir){ const t=editorSlide+dir; if (t<0||t>=slides.length) return; [slides[editorSlide],slides[t]]=[slides[t],slides[editorSlide]]; editorSlide=t; buildSlideList(); loadEditorSlide(editorSlide); showToast(dir<0?'Moved up':'Moved down'); }

// ═══════════════════════════════════════════════════════════
//  EXPORT  (image-based → identical to the designed slides)
// ═══════════════════════════════════════════════════════════
function toggleDownloadMenu(e){ e.stopPropagation(); document.getElementById('download-menu').classList.toggle('open'); }
document.addEventListener('click', () => document.getElementById('download-menu').classList.remove('open'));

// Cache a CORS-clean dataURL of the logo so exports don't taint the canvas
let _logoCache = { url:null, data:null, tried:false };
async function ensureLogoDataUrl(){
  const url = DECK_CONFIG.logoUrl;
  if (!url) return null;
  if (_logoCache.tried && _logoCache.url === url) return _logoCache.data;
  _logoCache = { url, data:null, tried:true };
  try {
    const img = new Image(); img.crossOrigin = 'anonymous';
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    const cv = document.createElement('canvas'); cv.width = img.naturalWidth; cv.height = img.naturalHeight;
    cv.getContext('2d').drawImage(img, 0, 0);
    _logoCache.data = cv.toDataURL('image/png');
  } catch(e){ _logoCache.data = null; }   // not CORS-allowed — fall back to raw URL (best effort)
  return _logoCache.data;
}

async function renderSlideToCanvas(i){
  const stage = document.getElementById('export-stage');
  const content = document.getElementById('export-content');
  const brand = document.getElementById('export-brand');
  const foot = document.getElementById('export-foot');
  const s = slides[i];
  content.style.transform = '';
  content.className = 'md export-md' + (s.type==='title'?' title':'') + (s.type==='part'?' part':'');
  let html = '';
  if (s.tag && s.type !== 'part') html += `<div class="export-tag">${escHtml(s.tag)}</div>`;
  html += renderMd(stripNotes(s.raw));
  if (s.type === 'title') html += titleCredits();
  content.innerHTML = html;

  // branding overlay (logo top-right + footer)
  const logoSrc = (await ensureLogoDataUrl()) || DECK_CONFIG.logoUrl;
  let b = '';
  if (logoSrc) b += `<img src="${escAttr(logoSrc)}" alt="" style="height:${(DECK_CONFIG.logoHeight||40)+4}px">`;
  if (DECK_CONFIG.eventName) b += `<div class="ev">${escHtml(DECK_CONFIG.eventName)}</div>`;
  brand.innerHTML = b;
  const f = footerParts();
  foot.style.display = f.hasAny ? 'flex' : 'none';
  foot.innerHTML = f.hasAny ? `<span>${f.left}</span><span class="foot-links">${f.right}</span>` : '';

  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  // auto-fit content into 720px height
  const avail = 720 - 0; // stage centers; content padding handles margin
  const h = content.offsetHeight;
  if (h > avail) content.style.transform = `scale(${(avail-8)/h})`;
  return await html2canvas(stage, { scale:2, backgroundColor:'#0a0e1a', width:1280, height:720, windowWidth:1280, windowHeight:720, useCORS:true, logging:false });
}

async function exportPNGs(){
  if (!window.html2canvas) return alert('Image export needs an internet connection (html2canvas failed to load).');
  showToast('Rendering slides…');
  try {
    if (window.JSZip){
      const zip = new JSZip();
      for (let i=0;i<slides.length;i++){
        const c = await renderSlideToCanvas(i);
        zip.file(`slide-${String(i+1).padStart(2,'0')}.png`, c.toDataURL('image/png').split(',')[1], {base64:true});
      }
      const blob = await zip.generateAsync({type:'blob'});
      downloadBlob(blob, 'KS-Business-slides.zip');
    } else {
      for (let i=0;i<slides.length;i++){ const c = await renderSlideToCanvas(i); downloadDataUrl(c.toDataURL('image/png'), `slide-${i+1}.png`); }
    }
    showToast('✅ PNGs exported');
  } catch(err){ console.error(err); showToast('Export failed — see console'); }
}

async function exportPDF(){
  const jspdfNS = window.jspdf || window.jsPDF;
  if (!jspdfNS || !window.html2canvas) return alert('PDF export needs an internet connection (libraries failed to load).');
  const { jsPDF } = jspdfNS;
  showToast('Building PDF…');
  try {
    const pdf = new jsPDF({ orientation:'landscape', unit:'px', format:[1280,720] });
    for (let i=0;i<slides.length;i++){
      const c = await renderSlideToCanvas(i);
      if (i>0) pdf.addPage([1280,720], 'landscape');
      pdf.addImage(c.toDataURL('image/png'), 'PNG', 0, 0, 1280, 720);
    }
    pdf.save('KS-Business-Pitch.pdf');
    showToast('✅ PDF exported');
  } catch(err){ console.error(err); showToast('PDF export failed — see console'); }
}

async function exportPPTX(){
  if (!window.PptxGenJS || !window.html2canvas) return alert('PPTX export needs an internet connection (libraries failed to load).');
  showToast('Building PowerPoint…');
  try {
    const pptx = new PptxGenJS();
    pptx.defineLayout({ name:'KS16x9', width:13.333, height:7.5 });
    pptx.layout = 'KS16x9';
    for (let i=0;i<slides.length;i++){
      const c = await renderSlideToCanvas(i);
      const slide = pptx.addSlide();
      slide.background = { color:'0A0E1A' };
      slide.addImage({ data:c.toDataURL('image/png'), x:0, y:0, w:13.333, h:7.5 });
      const n = extractNotes(slides[i].raw); if (n) slide.addNotes(n);
    }
    await pptx.writeFile({ fileName:'KS-Business-Pitch.pptx' });
    showToast('✅ PowerPoint exported');
  } catch(err){ console.error(err); showToast('PPTX export failed — see console'); }
}

function downloadHTML(){
  const slideDataStr = JSON.stringify(slides, null, 2);
  const cfgStr = JSON.stringify(DECK_CONFIG, null, 2);
  const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  const updated = html
    .replace(/const SLIDES_DATA = \[[\s\S]*?\n\];/, `const SLIDES_DATA = ${slideDataStr};`)
    .replace(/const DECK_CONFIG = \{[\s\S]*?\n\};/, `const DECK_CONFIG = ${cfgStr};`);
  downloadBlob(new Blob([updated], {type:'text/html'}), 'PITCH.html');
  showToast('💾 Downloaded PITCH.html');
}

function downloadBlob(blob, name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function downloadDataUrl(url, name){ const a=document.createElement('a'); a.href=url; a.download=name; a.click(); }

// ═══════════════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════════════
let toastTimer;
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200); }

// ═══════════════════════════════════════════════════════════
//  KEYBOARD
// ═══════════════════════════════════════════════════════════
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if (document.getElementById('editor-mode').classList.contains('open')) { if (e.key==='Escape') closeEditor(); return; }
  switch (e.key) {
    case 'ArrowRight': case 'ArrowDown': case 'PageDown': e.preventDefault(); goTo(currentSlide+1); break;
    case 'ArrowLeft': case 'ArrowUp': case 'PageUp': e.preventDefault(); goTo(currentSlide-1); break;
    case 'Home': goTo(0); break;
    case 'End': goTo(slides.length-1); break;
    case ' ': e.preventDefault(); togglePointer(); break;
    case 'g': case 'G': toggleGlow(); break;
    case 's': case 'S': toggleSpotlight(); break;
    case 'n': case 'N': toggleNotes(); break;
    case 'e': case 'E': openEditor(); break;
    case 'f': case 'F': enterPresent(); break;
    case 'Escape': exitPresent(); break;
  }
});

// Click halves of the slide area to navigate (presentation-friendly)
document.getElementById('slides-wrapper').addEventListener('click', (e) => {
  if (window.getSelection().toString()) return;             // don't nav while selecting text
  if (e.target.closest('a, button, pre, table')) return;
  (e.clientX > window.innerWidth/2 ? goTo(currentSlide+1) : goTo(currentSlide-1));
});

// ═══════════════════════════════════════════════════════════
//  CONFIG PANEL  (branding: logo · presented-by · links · text)
// ═══════════════════════════════════════════════════════════
const CFG_STORE_KEY = 'ksDeckConfig';
const CFG_DEFAULTS = JSON.parse(JSON.stringify(DECK_CONFIG));
let cfgDraft = null;

function loadStoredConfig(){
  try {
    const raw = localStorage.getItem(CFG_STORE_KEY);
    if (raw) Object.assign(DECK_CONFIG, JSON.parse(raw));
  } catch(e){}
}

function openConfig(){
  cfgDraft = JSON.parse(JSON.stringify(DECK_CONFIG));
  cfgDraft.presentedBy = cfgDraft.presentedBy || [];
  cfgDraft.links = cfgDraft.links || [];
  document.getElementById('cfg-logoUrl').value = cfgDraft.logoUrl || '';
  document.getElementById('cfg-logoHeight').value = cfgDraft.logoHeight || 40;
  document.getElementById('cfg-logoHeight-val').textContent = cfgDraft.logoHeight || 40;
  document.getElementById('cfg-eventName').value = cfgDraft.eventName || '';
  document.getElementById('cfg-footer').value = cfgDraft.footer || '';
  cfgRenderBy(); cfgRenderLinks(); cfgLogoPreview();
  document.getElementById('config-panel').classList.add('open');
}
function closeConfig(){ document.getElementById('config-panel').classList.remove('open'); }

function cfgRenderBy(){
  const wrap = document.getElementById('cfg-by-list');
  wrap.innerHTML = cfgDraft.presentedBy.map((v,i) =>
    `<div class="cfg-row"><input type="text" value="${escAttr(v)}" placeholder="Name or role" oninput="cfgDraft.presentedBy[${i}]=this.value">
     <button class="cfg-del" onclick="cfgDelBy(${i})" title="Remove">×</button></div>`).join('');
}
function cfgAddBy(){ cfgDraft.presentedBy.push(''); cfgRenderBy(); }
function cfgDelBy(i){ cfgDraft.presentedBy.splice(i,1); cfgRenderBy(); }

function cfgRenderLinks(){
  const wrap = document.getElementById('cfg-links-list');
  wrap.innerHTML = cfgDraft.links.map((l,i) =>
    `<div class="cfg-row"><input type="text" value="${escAttr(l.label||'')}" placeholder="Label" oninput="cfgDraft.links[${i}].label=this.value">
     <input type="text" value="${escAttr(l.url||'')}" placeholder="https://…" oninput="cfgDraft.links[${i}].url=this.value">
     <button class="cfg-del" onclick="cfgDelLink(${i})" title="Remove">×</button></div>`).join('');
}
function cfgAddLink(){ cfgDraft.links.push({label:'',url:''}); cfgRenderLinks(); }
function cfgDelLink(i){ cfgDraft.links.splice(i,1); cfgRenderLinks(); }

function cfgLogoPreview(){
  const url = document.getElementById('cfg-logoUrl').value.trim();
  const img = document.getElementById('cfg-logo-img');
  if (url){ img.src = url; img.style.display = 'block'; } else { img.style.display = 'none'; }
}

function applyConfig(){
  buildPresentation();
  try { localStorage.setItem(CFG_STORE_KEY, JSON.stringify(DECK_CONFIG)); } catch(e){}
  _logoCache = { url:null, data:null, tried:false };   // re-fetch logo for exports
}
function saveConfig(){
  cfgDraft.logoUrl = document.getElementById('cfg-logoUrl').value.trim();
  cfgDraft.logoHeight = parseInt(document.getElementById('cfg-logoHeight').value, 10) || 40;
  cfgDraft.eventName = document.getElementById('cfg-eventName').value.trim();
  cfgDraft.footer = document.getElementById('cfg-footer').value.trim();
  cfgDraft.presentedBy = cfgDraft.presentedBy.map(s => (s||'').trim()).filter(Boolean);
  cfgDraft.links = cfgDraft.links.filter(l => (l.label||'').trim());
  Object.assign(DECK_CONFIG, cfgDraft);
  applyConfig(); closeConfig(); showToast('⚙️ Branding applied');
}
function resetConfig(){
  Object.assign(DECK_CONFIG, JSON.parse(JSON.stringify(CFG_DEFAULTS)));
  try { localStorage.removeItem(CFG_STORE_KEY); } catch(e){}
  applyConfig(); openConfig(); showToast('Branding reset to defaults');
}

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
loadStoredConfig();
buildPresentation();
initThree();
updateFxHud();
</script>
